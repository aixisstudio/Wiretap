---
# Wiretap — example site playbook / playbook d'exemple
#   ansible-playbook -i inventory deploy/ansible/site.yml
- hosts: wiretap_agents
  become: true
  vars:
    wiretap_syslog_addr: "siem.example.com:514"
    wiretap_syslog_format: "cef"
    wiretap_peers: ["sec-01:8000", "sec-02:8000"]
  roles:
    - wiretap
